name: Diagnose N13 PDD VPS (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-vps.yml']
permissions:
  contents: read
concurrency:
  group: n13-pdd-deploy
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSH_KEY_B64: ${{ secrets.PDD_VPS_SSH_KEY_B64 }}
      SSH_KEY_RAW: ${{ secrets.PDD_VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate SSH key without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing VPS_HOST'; exit 1; }
          install -m 700 -d ~/.ssh
          umask 077
          python - <<'PYKEY'
          import base64, os, subprocess
          from pathlib import Path
          target = Path.home() / '.ssh/id_pdd'
          for name in ('SSH_KEY_B64', 'SSH_KEY_RAW'):
              raw = os.environ.get(name, '').strip().replace('\\n', '\n').replace('\r', '')
              if not raw:
                  continue
              try:
                  key = raw.encode() if raw.startswith('-----BEGIN ') else base64.b64decode(''.join(raw.split()), validate=True)
                  target.write_bytes(key.rstrip() + b'\n')
                  check = subprocess.run(['ssh-keygen', '-y', '-P', '', '-f', str(target)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if check.returncode == 0:
                      print('Usable SSH key selected from ' + name)
                      break
              except (ValueError, UnicodeError):
                  continue
          else:
              target.unlink(missing_ok=True)
              raise SystemExit('Neither configured SSH secret contains a usable unencrypted key')
          PYKEY
          ssh-keygen -y -f ~/.ssh/id_pdd >/dev/null 2>&1 || { echo 'SSH key cannot be parsed (invalid or encrypted key)'; exit 1; }
      - name: One-time authorized build cache cleanup older than 24h
        if: github.event_name == 'push' && github.event.head_commit.message == 'Run authorized build cache cleanup older than 24h (2026-10-29 1606 UTC)' && github.run_attempt == 1
        shell: bash
        run: |
          ssh -i ~/.ssh/id_pdd -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" 'python3 -' <<'CACHECLEAN'
          import datetime, json, subprocess
          def run(args, timeout=45):
              return subprocess.check_output(args,text=True,timeout=timeout)
          def snapshot():
              ids=run(["docker","ps","-aq"]).split()
              result={}
              for c in json.loads(run(["docker","inspect",*ids]) if ids else "[]"):
                  s=c["State"]
                  result[c["Id"]]={"name":c["Name"],"running":s["Running"],"status":s["Status"],"started_at":s["StartedAt"],"restart_count":c["RestartCount"],"health":s.get("Health",{}).get("Status"),"image":c["Image"]}
              return result
          before=snapshot()
          volumes_before=set(run(["docker","volume","ls","-q"]).split())
          images_before=set(run(["docker","image","ls","-aq","--no-trunc"]).split())
          print("CLEANUP_AT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          print("DISK_BEFORE",run(["df","-B1","/"]),flush=True)
          print("CACHE_BEFORE",run(["docker","system","df"]),flush=True)
          print("PRUNE_SCOPE: dangling build cache unused for at least 24 hours",flush=True)
          result=subprocess.run(["docker","builder","prune","--force","--filter","until=24h"],text=True,capture_output=True,timeout=240)
          print(result.stdout,flush=True)
          print("PRUNE_EXIT_CODE",result.returncode,flush=True)
          after=snapshot()
          volumes_after=set(run(["docker","volume","ls","-q"]).split())
          images_after=set(run(["docker","image","ls","-aq","--no-trunc"]).split())
          print("CONTAINER_STATE_UNCHANGED",before==after,flush=True)
          print("VOLUME_NAMES_UNCHANGED",volumes_before==volumes_after,flush=True)
          print("SAVED_IMAGES_PRESERVED",images_before.issubset(images_after),flush=True)
          for item in after.values():
              print("CONTAINER",json.dumps(item),flush=True)
          print("DISK_AFTER",run(["df","-B1","/"]),flush=True)
          print("CACHE_AFTER",run(["docker","system","df"]),flush=True)
          if result.returncode or before!=after or volumes_before!=volumes_after or not images_before.issubset(images_after):
              raise SystemExit("Cleanup or verification requires inspection")
          
          CACHECLEAN
      - name: Read PDD status, sanitized logs, SQLite and Telegram connectivity
        shell: bash
        run: |
          ssh -i ~/.ssh/id_pdd -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" 'python3 -' < tools/diagnose_vps.py
      - name: Measure server and project disk usage (read only)
        shell: bash
        run: |
          ssh -i ~/.ssh/id_pdd -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" 'python3 -' <<'DISKPROBE'
          import datetime, json, os, subprocess
          def run(args, timeout=55):
              try:
                  r=subprocess.run(args, capture_output=True, text=True, timeout=timeout)
                  if r.returncode:
                      print(json.dumps({"command":args[:3],"exit_code":r.returncode}))
                  return r.stdout
              except subprocess.TimeoutExpired:
                  print(json.dumps({"command":args[:3],"timeout":True}))
                  return ""
          def section(name, args, timeout=55):
              print("\n=== "+name+" ===", flush=True)
              print(run(args,timeout), flush=True)
          print("MEASURED_AT_UTC",datetime.datetime.now(datetime.timezone.utc).isoformat(),flush=True)
          section("FILESYSTEM_BYTES",["df","-B1","/"])
          section("ROOT_DIRECTORY_BYTES",["du","-x","-B1","--max-depth=1","/"],90)
          section("PROJECT_DIRECTORY_BYTES",["du","-x","-B1","--max-depth=2","/opt"],60)
          section("VAR_DIRECTORY_BYTES",["du","-x","-B1","--max-depth=2","/var"],60)
          section("DOCKER_DISK_USAGE",["docker","system","df","-v"],60)
          section("JOURNAL_DISK_USAGE",["journalctl","--disk-usage"],15)
          print("\n=== SWAP_ALLOCATED_BYTES ===",flush=True)
          if os.path.exists("/swapfile"):
              st=os.stat("/swapfile")
              print(json.dumps({"path":"/swapfile","size_bytes":st.st_size,"allocated_bytes":st.st_blocks*512}))
          print("\n=== CONTAINER_STORAGE_MAP ===",flush=True)
          ids=run(["docker","ps","-aq"]).split()
          if ids:
              raw=run(["docker","inspect","--size",*ids],45)
              for c in json.loads(raw or "[]"):
                  labels=c.get("Config",{}).get("Labels") or {}
                  lp=c.get("LogPath") or ""
                  print(json.dumps({
                      "name":c.get("Name"),"status":c.get("State",{}).get("Status"),
                      "image_id":c.get("Image"),"image_ref":c.get("Config",{}).get("Image"),
                      "project":labels.get("com.docker.compose.project"),
                      "service":labels.get("com.docker.compose.service"),
                      "working_dir":labels.get("com.docker.compose.project.working_dir"),
                      "writable_layer_bytes":c.get("SizeRw"),
                      "log_allocated_bytes":os.stat(lp).st_blocks*512 if lp and os.path.exists(lp) else 0,
                      "mounts":[{"type":m.get("Type"),"name":m.get("Name"),"source":m.get("Source"),"destination":m.get("Destination")} for m in c.get("Mounts",[])]
                  }))
          print("\n=== VOLUME_ALLOCATED_BYTES ===",flush=True)
          names=run(["docker","volume","ls","-q"]).split()
          if names:
              raw=run(["docker","volume","inspect",*names],15)
              for v in json.loads(raw or "[]"):
                  mp=v.get("Mountpoint")
                  labels=v.get("Labels") or {}
                  size=run(["du","-sx","-B1",mp],30).split()[0] if mp else None
                  print(json.dumps({"name":v.get("Name"),"project":labels.get("com.docker.compose.project"),"allocated_bytes":size}))
          
          DISKPROBE
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_pdd
