name: Verify Telegram bot credentials
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-bot.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify Telegram identity via getMe
        env:
          BOT_TOKEN: ${{ secrets.PDD_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          from aiogram import Bot
          async def verify():
              token = os.environ.get("BOT_TOKEN")
              if not token:
                  raise SystemExit("Missing PDD_BOT_TOKEN")
              bot = Bot(token=token)
              try:
                  me = await bot.get_me()
                  if me.username != "N13_PDD_Trainer_Bot":
                      raise SystemExit("Unexpected bot username")
                  print("Bot credentials validated; username matched.")
              finally:
                  await bot.session.close()
          asyncio.run(verify())
          PY
