services:
  pdd:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${PDD_BOT_TOKEN:?Set PDD_BOT_TOKEN in an untracked .env file}
      DATABASE_PATH: /srv/n13/data/n13-pdd.sqlite3
    volumes:
      - pdd_data:/srv/n13/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
volumes:
  pdd_data:
