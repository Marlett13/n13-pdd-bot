name: N13 ABM candidate audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/fetch_abm.py'
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/abm-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and audit candidate
        run: python tools/fetch_abm.py
      - name: Install Telegram dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Telegram layer
        run: python -m compileall -q app
      - name: Import Telegram layer
        run: python -c 'import app.bot; print("Telegram layer imports")'
      - name: Check question bank integration
        run: python -m tests.test_question_bank
      - name: Save candidate and audit (not production data)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abm-candidate-audit
          path: data/abm_candidate/
          if-no-files-found: warn
          retention-days: 7
