name: Deploy N13 PDD to VPS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n13-pdd-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSH_KEY_B64: ${{ secrets.PDD_VPS_SSH_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact revision before deployment
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          bash -n tools/recover_vps.sh
      - name: Configure SSH key without disclosure
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST" || { echo 'Missing VPS_HOST'; exit 1; }
          install -m 700 -d ~/.ssh
          umask 077
          python - <<'PY'
          import base64,os
          from pathlib import Path
          raw=os.environ['SSH_KEY_B64'].strip().replace('\\n','\n').replace('\r','')
          try:
              key=raw.encode() if raw.startswith('-----BEGIN ') else base64.b64decode(''.join(raw.split()),validate=True)
              Path.home().joinpath('.ssh/id_pdd').write_bytes(key.rstrip()+b'\n')
          except (ValueError,UnicodeError):
              raise SystemExit('Invalid SSH key encoding')
          PY
          ssh-keygen -y -f ~/.ssh/id_pdd >/dev/null 2>&1 || { echo 'SSH key cannot be parsed'; exit 1; }
      - name: Back up SQLite and deploy only existing PDD through Mihomo
        run: |
          ssh -i ~/.ssh/id_pdd -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" "bash -s -- '$GITHUB_SHA'" < tools/recover_vps.sh
      - name: Remove runner key
        if: always()
        run: rm -f ~/.ssh/id_pdd
