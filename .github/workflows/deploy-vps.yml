name: Deploy N13 PDD to VPS
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: n13-pdd-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.PDD_VPS_HOST }}
      VPS_USER: ${{ secrets.PDD_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.PDD_VPS_SSH_KEY }}
      BOT_TOKEN: ${{ secrets.PDD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        shell: bash
        run: |
          for key in VPS_HOST VPS_USER VPS_SSH_KEY BOT_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing required configuration: $key"
              exit 1
            fi
          done
      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload isolated app
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'mkdir -p /opt/n13-pdd'
          tar --exclude=.git --exclude=data -czf - . |
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'tar -xzf - -C /opt/n13-pdd'
      - name: Install token without printing it
        shell: bash
        run: |
          printf 'PDD_BOT_TOKEN=%s\n' "$BOT_TOKEN" |
            ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'umask 077; cat > /opt/n13-pdd/.env'
      - name: Start isolated stack
        shell: bash
        run: |
          ssh -i ~/.ssh/id_deploy -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/n13-pdd && docker compose -p n13-pdd -f compose.yml up -d --build && docker compose -p n13-pdd -f compose.yml ps'
