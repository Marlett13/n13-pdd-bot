name: Validate N13 PDD deployment
on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile
      - compose.yml
      - tools/prepare_data.py
      - requirements.txt
      - '.github/workflows/deploy-check.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose syntax
        env:
          PDD_BOT_TOKEN: placeholder-only-not-a-token
        run: docker compose -f compose.yml config -q
      - name: Build container
        run: docker build -t n13-pdd:ci .
