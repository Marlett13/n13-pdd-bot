name: Deploy N13 PDD to VPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vps.yml'
permissions:
  contents: read
concurrency:
  group: n13-pdd-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSH_KEY_B64: ${{ secrets.PDD_VPS_SSH_KEY_B64 }}
      BOT_TOKEN: ${{ secrets.PDD_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration
        shell: bash
        run: |
          for key in VPS_HOST SSH_KEY_B64 BOT_TOKEN; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done
      - name: Configure deployment key
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf "%s" "$SSH_KEY_B64" | base64 --decode > ~/.ssh/id_n13_pdd
          ssh-keygen -y -f ~/.ssh/id_n13_pdd >/dev/null
          chmod 600 ~/.ssh/id_n13_pdd
      - name: Verify server access and Docker
        shell: bash
        run: |
          ssh -i ~/.ssh/id_n13_pdd -o BatchMode=yes -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" 'docker compose version && mkdir -p /opt/n13-pdd'
      - name: Upload PDD app only
        shell: bash
        run: |
          tar --exclude=.git --exclude=data -czf - . |
            ssh -i ~/.ssh/id_n13_pdd -o BatchMode=yes -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" 'tar -xzf - -C /opt/n13-pdd'
      - name: Install PDD Telegram credential securely
        shell: bash
        run: |
          printf 'PDD_BOT_TOKEN=%s\n' "$BOT_TOKEN" |
            ssh -i ~/.ssh/id_n13_pdd -o BatchMode=yes -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" 'umask 077; cat > /opt/n13-pdd/.env; chmod 600 /opt/n13-pdd/.env'
      - name: Start only PDD stack
        shell: bash
        run: |
          ssh -i ~/.ssh/id_n13_pdd -o BatchMode=yes -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" \
            'cd /opt/n13-pdd && docker compose -p n13-pdd up -d --build && docker compose -p n13-pdd ps'
